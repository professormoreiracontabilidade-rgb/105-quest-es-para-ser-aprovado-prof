.alt .letter{min-width:34px;height:34px;border-radius:10px;background:#e5eef8;color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:900}
.alt.selected{border-color:var(--azul2);background:#eaf4ff} .alt.correct{border-color:var(--verde);background:#ecfdf3} .alt.wrong{border-color:var(--vermelho);background:#fff1f2}
.answerBox{background:#f8fafc;border-left:6px solid var(--azul);padding:12px;border-radius:12px;margin:12px 0;font-size:16px;line-height:1.45}
.gabarito{font-size:22px;font-weight:900;color:var(--verde)} .comment{font-size:17px;line-height:1.48} .comment b{color:var(--azul)}
.bottom{display:none}
.nav{max-width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px} .nav.three{grid-template-columns:1fr 1fr 1fr}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px} .dot{padding:8px 0;border-radius:10px;background:#e5e7eb;color:#111;font-size:12px;font-weight:bold} .dot.answered{background:#bbf7d0} .dot.current{outline:3px solid var(--azul)}
.final h2{color:var(--azul)} textarea{width:100%;height:160px;border:2px solid #dbe7f3;border-radius:14px;padding:12px;font-size:14px}

.draw-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 10px;background:#eef6ff;border:1px solid #cfe1f5;border-radius:16px;padding:8px;position:sticky;top:92px;z-index:8}
.draw-toolbar .tool{font-size:13px;padding:9px 10px;border-radius:12px;background:#e6eef7;color:#082b4a;box-shadow:none;white-space:nowrap}
.draw-toolbar .tool.active{background:#082b4a;color:white;outline:2px solid #facc15}
.draw-toolbar .danger-mini{background:#fee2e2!important;color:#991b1b!important}
.paper-draw{position:relative;background:#fff;border:2px solid #cfe1f5;border-radius:16px;overflow:hidden;min-height:75vh;box-shadow:inset 0 0 0 1px rgba(8,43,74,.04)}
.paper-content{position:relative;z-index:1;padding:2px;min-height:75vh}
.ink-canvas{position:absolute;left:0;top:0;z-index:3;touch-action:none;display:block;background:transparent;pointer-events:auto}
.ink-canvas.pen-cursor{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24'>✒️</text></svg>") 2 26, crosshair;}
.ink-canvas.eraser-cursor{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24'>🧽</text></svg>") 8 24, cell;}
.pen-help{font-size:12px;color:#475569;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;margin-top:9px;padding:9px;line-height:1.35}
.study-card{min-height:75vh}

@media print{.bottom,.header .progress,.lock{display:none} body{background:white} .app{max-width:none;padding:0} .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
@media(min-width:800px){.app{padding:8px 20px 28px}.header{border-radius:12px}.card{border-radius:12px;padding:16px}.paper-draw,.paper-content{min-height:78vh}.draw-toolbar{top:90px}.grid{grid-template-columns:repeat(15,1fr)}}

<script>
const QUESTIONS = [{"n":1,"text":"Segundo a NBC TG Estrutura Conceitual, para que a representação das informações financeiras seja fidedigna, ela deve ser:","alts":[{"letter":"A","text":"completa, neutra e isenta de erros."},{"letter":"B","text":"relevante, tempestiva e comparável."},{"letter":"C","text":"prudente, verificável e material."},{"letter":"D","text":"uniforme, compreensível e conservadora."}],"answer":"A","comment":"<b>Comentário:</b> Representação fidedigna exige três atributos: completude, neutralidade e ausência de erro. Tempestividade, comparabilidade, verificabilidade e compreensibilidade são características de melhoria."},{"n":2,"text":"De acordo com a NBC TG Estrutura Conceitual, a informação contábil representa fidedignamente o fenômeno econômico quando e:","alts":[{"letter":"A","text":"completa, neutra e livre de erro material."},{"letter":"B","text":"comparável, verificável e tempestiva."},{"letter":"C","text":"material, prudente e conservadora."},{"letter":"D","text":"tempestiva, útil e uniforme."}],"answer":"A","comment":"<b>Comentário:</b> A banca costuma trocar características fundamentais por características de melhoria. A representação fidedigna esta ligada a completar a descrição, manter neutralidade e evitar erros."},{"n":3,"text":"Segundo a NBC TG 26, ao elaborar as demonstrações contábeis, a administração deve avaliar se a entidade continuará em operação no futuro previsível. Esse pressuposto é denominado:","alts":[{"letter":"A","text":"continuidade."},{"letter":"B","text":"competência."},{"letter":"C","text":"materialidade."},{"letter":"D","text":"compensação."}],"answer":"A","comment":"<b>Comentário:</b> As demonstrações são elaboradas sob o pressuposto da continuidade, salvo intenção de liquidar, encerrar atividades ou inexistencia de alternativa realista."},{"n":4,"text":"A Cia Horizonte não pretende encerrar suas atividades e não há indícios de liquidação. Assim, suas demonstrações contábeis devem ser elaboradas com base no pressuposto da:","alts":[{"letter":"A","text":"continuidade."},{"letter":"B","text":"caixa."},{"letter":"C","text":"prudência absoluta."},{"letter":"D","text":"compensação obrigatória."}],"answer":"A","comment":"<b>Comentário:</b> O pressuposto adequado e continuidade. Regime de caixa não é base geral para elaboracao das demonstrações, e compensação não é pressuposto."},{"n":5,"text":"Sobre ativo não circulante mantido para venda, análise: I. Quando atendidos os critérios, deve ser apresentado no ativo circulante. II. As regras também se aplicam a ativo destinado a distribuição aos sócios. III. Deve ser mensurado pelo maior entre valor contábil e valor justo líquido de despesas de venda. Esta correto:","alts":[{"letter":"A","text":"I, somente."},{"letter":"B","text":"I e II, somente."},{"letter":"C","text":"I, II e III."},{"letter":"D","text":"II, somente."}],"answer":"B","comment":"<b>Comentário:</b> I e II estão corretas. O erro esta na III: a mensuração e pelo menor entre o valor contábil é o valor justo menos despesas de venda."},{"n":6,"text":"Uma entidade classificou um equipamento como mantido para venda. Julgue: I. Ele passa a ser apresentado separadamente no circulante. II. A depreciação deve ser interrompida. III. A mensuração inicial da classificação e pelo maior valor entre custo histórico e valor justo. Esta correto:","alts":[{"letter":"A","text":"I e II, somente."},{"letter":"B","text":"I, somente."},{"letter":"C","text":"II e III, somente."},{"letter":"D","text":"I, II e III."}],"answer":"A","comment":"<b>Comentário:</b> Mantido para venda fica no circulante e deixa de ser depreciado. A mensuração e pelo menor entre valor contábil e valor justo líquido de despesas de venda, não pelo maior."},{"n":7,"text":"Relacione: a. Despesa; b. Patrimônio Líquido; c. Receita. I. Aumentos nos ativos ou reduções nos passivos que aumentam o PL. II. Reduções nos ativos ou aumentos nos passivos que reduzem o PL. III. Participação residual nos ativos após deduzir passivos. A sequencia a, b e c e:","alts":[{"letter":"A","text":"II - III - I."},{"letter":"B","text":"I - III - II."},{"letter":"C","text":"II - I - III."},{"letter":"D","text":"I - II - III."}],"answer":"A","comment":"<b>Comentário:</b> Despesa reduz o PL; patrimônio líquido é a participação residual; receita aumenta o PL."},{"n":8,"text":"Conforme a Estrutura Conceitual, associe: a. Receita; b. Despesa; c. Patrimônio Líquido. I. Participação residual nos ativos depois de deduzidos os passivos. II. Aumentos nos ativos ou reduções nos passivos que elevam o PL. III. Reduções nos ativos ou aumentos nos passivos que diminuem o PL. A ordem a, b e c e:","alts":[{"letter":"A","text":"II - III - I."},{"letter":"B","text":"III - II - I."},{"letter":"C","text":"I - II - III."},{"letter":"D","text":"II - I - III."}],"answer":"A","comment":"<b>Comentário:</b> Receita aumenta o PL; despesa diminui o PL; PL e o resíduo dos ativos menos passivos."},{"n":9,"text":"A sociedade Alfa recebeu laudo indicando perda provável em ação cível, mas o valor não pode ser mensurado com confiabilidade. O tratamento adequado e:","alts":[{"letter":"A","text":"reconhecer provisão pelo maior valor estimado."},{"letter":"B","text":"reconhecer provisão pelo menor valor possível."},{"letter":"C","text":"não reconhecer provisão e divulgar como passivo contingente."},{"letter":"D","text":"não reconhecer nem divulgar."}],"answer":"C","comment":"<b>Comentário:</b> Para reconhecer provisão, e necessário obrigação presente, saída provável de recursos e estimativa confiavel. Sem mensuração confiavel, não se reconhece provisão; divulga-se passivo contingente."},{"n":10,"text":"A Cia Beta tem processo trabalhista com perda provável, mas os advogados afirmam que não há estimativa confiavel do valor. Nas demonstrações, a companhia deve:","alts":[{"letter":"A","text":"registrar despesa e provisão."},{"letter":"B","text":"registrar ativo contingente."},{"letter":"C","text":"não reconhecer provisão e divulgar em nota explicativa."},{"letter":"D","text":"ignorar o fato por ser apenas provável."}],"answer":"C","comment":"<b>Comentário:</b> A falta de estimativa confiavel impede o reconhecimento. Como há probabilidade de saída de recursos, a informação deve ser divulgada em nota como passivo contingente."},{"n":11,"text":"Na DVA, a reversão de perdas estimadas com créditos de liquidação duvidosa deve ser apresentada:","alts":[{"letter":"A","text":"em remuneração de capitais próprios."},{"letter":"B","text":"em remuneração de capitais de terceiros."},{"letter":"C","text":"em valor adicionado recebido em transferência."},{"letter":"D","text":"em riqueza criada pela própria entidade."}],"answer":"D","comment":"<b>Comentário:</b> PECLD e sua reversão integram a primeira parte da DVA, dentro da riqueza criada pela própria entidade, como item ligado a receitas e insumos/retenções."},{"n":12,"text":"Uma empresa reconheceu reversão de perda estimada com clientes no período. Na DVA, esse valor deve compor:","alts":[{"letter":"A","text":"a primeira parte, como riqueza criada pela própria entidade."},{"letter":"B","text":"a segunda parte, como distribuição a empregados."},{"letter":"C","text":"a segunda parte, como remuneração de capital de terceiros."},{"letter":"D","text":"valor adicionado recebido em transferência."}],"answer":"A","comment":"<b>Comentário:</b> A reversão de PECLD entra na apuração do valor adicionado gerado pela entidade, não na distribuição do valor adicionado."},{"n":13,"text":"Na DVA, o total de remuneração de capitais próprios corresponde, em regra, a:","alts":[{"letter":"A","text":"lucros retidos/prejuizo do exercício e dividendos/juros sobre capital proprio."},{"letter":"B","text":"apenas reservas de capital."},{"letter":"C","text":"apenas pagamento de empréstimos."},{"letter":"D","text":"salários, encargos e benefícios."}],"answer":"A","comment":"<b>Comentário:</b> Remuneração de capitais próprios engloba dividendos, juros sobre capital proprio e lucros retidos ou prejuizo do exercício."},{"n":14,"text":"Ao distribuir o valor adicionado, a entidade classificou dividendos e lucros retidos. Esses itens pertencem ao grupo:","alts":[{"letter":"A","text":"remuneração de capitais próprios."},{"letter":"B","text":"remuneração de capitais de terceiros."},{"letter":"C","text":"pessoal."},{"letter":"D","text":"governo."}],"answer":"A","comment":"<b>Comentário:</b> Dividendos, JCP e lucros retidos representam remuneração dos proprietários ou manutenção do resultado no patrimônio líquido."},{"n":15,"text":"Uma loja apresentou: receita de clientes R$ 300.000; CMV, incluindo impostos recuperaveis, R$ 120.000; PECLD R$ 9.000; perda por impairment do imobilizado R$ 15.000; depreciação R$ 20.000. O valor adicionado líquido produzido e:","alts":[{"letter":"A","text":"R$ 136.000."},{"letter":"B","text":"R$ 156.000."},{"letter":"C","text":"R$ 171.000."},{"letter":"D","text":"R$ 180.000."}],"answer":"A","comment":"<b>Comentário:</b> DVA: receita 300.000 - insumos de terceiros (CMV 120.000 + PECLD 9.000 + impairment 15.000) = valor adicionado bruto 156.000. Menos depreciação 20.000 = valor adicionado líquido 136.000."},{"n":16,"text":"Uma papelaria informou: receita R$ 250.000; CMV R$ 90.000; PECLD R$ 8.000; perda por desvalorização R$ 12.000; depreciação R$ 18.000. O valor adicionado líquido produzido na DVA e:","alts":[{"letter":"A","text":"R$ 122.000."},{"letter":"B","text":"R$ 140.000."},{"letter":"C","text":"R$ 158.000."},{"letter":"D","text":"R$ 232.000."}],"answer":"A","comment":"<b>Comentário:</b> Cálculo: 250.000 - 90.000 - 8.000 - 12.000 = 140.000 de valor adicionado bruto. Subtrai depreciação de 18.000, chegando a 122.000."},{"n":17,"text":"A entidade deve divulgar passivo contingente em notas, salvo quando a possibilidade de desembolso for:","alts":[{"letter":"A","text":"remota."},{"letter":"B","text":"possível."},{"letter":"C","text":"provável."},{"letter":"D","text":"possível ou provável."}],"answer":"A","comment":"<b>Comentário:</b> Passivos contingentes possíveis são divulgados. Quando a chance de desembolso e remota, a divulgação e dispensada."},{"n":18,"text":"Uma ação judicial tem chance remota de perda, conforme avaliação jurídica. Em relação ao passivo contingente, a entidade deve:","alts":[{"letter":"A","text":"não reconhecer e, em regra, não divulgar."},{"letter":"B","text":"reconhecer provisão integral."},{"letter":"C","text":"divulgar obrigatoriamente em nota."},{"letter":"D","text":"reconhecer ativo contingente."}],"answer":"A","comment":"<b>Comentário:</b> Se a perda e remota, não há reconhecimento de provisão e, em regra, não há divulgação de passivo contingente."},{"n":19,"text":"Em 01/04/2025, a Cia Azul pagou R$ 24.000 por 6 anúncios, sendo 3 veiculados em maio e 3 em junho. Pelo regime de competência, a despesa deve ser reconhecida:","alts":[{"letter":"A","text":"R$ 24.000 em abril."},{"letter":"B","text":"R$ 12.000 em maio e R$ 12.000 em junho."},{"letter":"C","text":"R$ 12.000 em julho e R$ 12.000 em agosto."},{"letter":"D","text":"R$ 4.000 de abril a setembro."}],"answer":"B","comment":"<b>Comentário:</b> A despesa é reconhecida quando o serviço de publicidade e prestado, não no pagamento nem quando surgirem possíveis benefícios futuros."},{"n":20,"text":"Uma empresa pagou R$ 30.000 por 10 inserções publicitárias, realizadas igualmente em setembro e outubro. Pelo regime de competência, reconhece:","alts":[{"letter":"A","text":"R$ 30.000 no pagamento."},{"letter":"B","text":"R$ 15.000 em setembro e R$ 15.000 em outubro."},{"letter":"C","text":"R$ 30.000 quando aumentar o faturamento."},{"letter":"D","text":"R$ 3.000 por mês durante dez meses."}],"answer":"B","comment":"<b>Comentário:</b> Como as inserções ocorreram metade em setembro e metade em outubro, a despesa acompanha a prestação do serviço."},{"n":21,"text":"Uma empresa comprou equipamentos por R$ 60.000. O frete rodoviario normal seria R$ 3.000, mas pagou R$ 8.000 por transporte aéreo para antecipar a entrega. Instalação: R$ 2.000. Testes: R$ 4.000. O custo do imobilizado e:","alts":[{"letter":"A","text":"R$ 69.000."},{"letter":"B","text":"R$ 74.000."},{"letter":"C","text":"R$ 66.000."},{"letter":"D","text":"R$ 60.000."}],"answer":"A","comment":"<b>Comentário:</b> Entram no custo: preço, frete necessário normal, instalação e testes. O excedente do frete por urgencia não é necessário para colocar o ativo em condição de uso. 60.000 + 3.000 + 2.000 + 4.000 = 69.000."},{"n":22,"text":"A Cia Norte adquiriu computadores por R$ 35.000. O frete comum custaria R$ 1.500, mas pagou R$ 4.500 por entrega expressa. Instalação R$ 800 e testes R$ 1.200. O valor registrado no imobilizado e:","alts":[{"letter":"A","text":"R$ 38.500."},{"letter":"B","text":"R$ 41.500."},{"letter":"C","text":"R$ 36.500."},{"letter":"D","text":"R$ 35.000."}],"answer":"A","comment":"<b>Comentário:</b> Somam-se os custos diretamente atribuíveis necessários: 35.000 + frete normal 1.500 + instalação 800 + testes 1.200 = 38.500. O excedente do frete expresso e despesa."},{"n":23,"text":"A empresa processou duas partes pedindo R$ 20.000 e R$ 30.000. Os advogados classificaram as chances de ganho como possível e provável, respectivamente. O ativo contingente a reconhecer e:","alts":[{"letter":"A","text":"zero."},{"letter":"B","text":"R$ 20.000."},{"letter":"C","text":"R$ 30.000."},{"letter":"D","text":"R$ 50.000."}],"answer":"A","comment":"<b>Comentário:</b> Ativo contingente não é reconhecido nas demonstrações. Quando a entrada e provável, pode haver divulgação; reconhecimento só ocorre quando a realizacao e praticamente certa."},{"n":24,"text":"Uma entidade pede indenizacao de R$ 12.000 com chance remota e R$ 18.000 com chance possível. Nas demonstrações contábeis, o ativo contingente reconhecido será:","alts":[{"letter":"A","text":"zero."},{"letter":"B","text":"R$ 12.000."},{"letter":"C","text":"R$ 18.000."},{"letter":"D","text":"R$ 30.000."}],"answer":"A","comment":"<b>Comentário:</b> Ativos contingentes não são reconhecidos por prudência. Chance possível ou remota não gera ativo nas demonstrações."},{"n":25,"text":"A empresa Arcus contratou exames médicos para empregados por R$ 10.000. Os empregados reembolsam 30% e a empresa arca com o restante. O impacto na DRE e:","alts":[{"letter":"A","text":"-R$ 3.000."},{"letter":"B","text":"-R$ 7.000."},{"letter":"C","text":"-R$ 10.000."},{"letter":"D","text":"zero."}],"answer":"B","comment":"<b>Comentário:</b> O gasto total e 10.000, mas 30% será suportado pelos empregados. A parcela da empresa e 70%: 7.000 de despesa."},{"n":26,"text":"A Cia Vida pagou R$ 8.000 por atendimento medico aos funcionários. Do total, 25% será descontado dos empregados. O impacto no resultado da empresa e:","alts":[{"letter":"A","text":"-R$ 2.000."},{"letter":"B","text":"-R$ 6.000."},{"letter":"C","text":"-R$ 8.000."},{"letter":"D","text":"-R$ 10.000."}],"answer":"B","comment":"<b>Comentário:</b> A empresa reconhece apenas a parcela que efetivamente suporta: 75% de 8.000 = 6.000."},{"n":27,"text":"Um restaurante comprou forno por R$ 50.000 e obteve desconto de 10% por pagamento imediato. A saída de caixa foi R$ 45.000. A contrapartida correta e:","alts":[{"letter":"A","text":"Ativo imobilizado de R$ 45.000."},{"letter":"B","text":"Ativo imobilizado de R$ 50.000 e receita financeira de R$ 5.000."},{"letter":"C","text":"Ativo imobilizado de R$ 50.000 e outras receitas de R$ 5.000."},{"letter":"D","text":"Ativo imobilizado de R$ 50.000 e retificadora de R$ 5.000."}],"answer":"A","comment":"<b>Comentário:</b> Desconto obtido na aquisição reduz o custo de compra. O imobilizado entra pelo valor efetivamente pago/valor de aquisição líquido: 45.000."},{"n":28,"text":"Um hotel adquiriu equipamento por R$ 80.000, com abatimento comercial de 5% por pagamento via Pix. O caixa diminuiu R$ 76.000. O lançamento reconhece:","alts":[{"letter":"A","text":"ativo imobilizado de R$ 76.000."},{"letter":"B","text":"ativo imobilizado de R$ 80.000 e receita de R$ 4.000."},{"letter":"C","text":"despesa de R$ 4.000."},{"letter":"D","text":"ativo imobilizado de R$ 80.000 e passivo de R$ 4.000."}],"answer":"A","comment":"<b>Comentário:</b> O abatimento reduz diretamente o custo do ativo. Não se reconhece receita financeira por desconto comercial na compra."},{"n":29,"text":"Uma empresa possui: caixa R$ 80.000; estoques R$ 170.000; empréstimos CP R$ 120.000; financiamento LP R$ 300.000; imobilizado R$ 520.000; intangível R$ 180.000; capital social R$ 350.000. O ativo não circulante e:","alts":[{"letter":"A","text":"R$ 700.000."},{"letter":"B","text":"R$ 250.000."},{"letter":"C","text":"R$ 520.000."},{"letter":"D","text":"R$ 1.050.000."}],"answer":"A","comment":"<b>Comentário:</b> Ativo não circulante inclui imobilizado e intangível: 520.000 + 180.000 = 700.000. Caixa e estoques são circulantes."},{"n":30,"text":"Em 31/12/X1, a entidade tinha caixa R$ 60.000, estoques R$ 90.000, contas a receber R$ 40.000, imobilizado R$ 310.000 e intangível R$ 140.000. O ativo não circulante soma:","alts":[{"letter":"A","text":"R$ 450.000."},{"letter":"B","text":"R$ 190.000."},{"letter":"C","text":"R$ 310.000."},{"letter":"D","text":"R$ 640.000."}],"answer":"A","comment":"<b>Comentário:</b> O ativo não circulante considerado é formado por imobilizado e intangível: 310.000 + 140.000 = 450.000."},{"n":31,"text":"Materiais foram comprados em março, pagos em junho e utilizados na prestação de servicos em abril. Pelo regime de competência, a despesa deve ser reconhecida em:","alts":[{"letter":"A","text":"março."},{"letter":"B","text":"abril."},{"letter":"C","text":"junho."},{"letter":"D","text":"dezembro."}],"answer":"B","comment":"<b>Comentário:</b> A despesa é reconhecida quando os materiais são consumidos/utilizados para gerar receita, ou seja, em abril."},{"n":32,"text":"A empresa comprou insumos em janeiro, pagou em fevereiro e consumiu os insumos na prestação de servicos em maio. A despesa deve ser reconhecida em:","alts":[{"letter":"A","text":"janeiro."},{"letter":"B","text":"fevereiro."},{"letter":"C","text":"maio."},{"letter":"D","text":"quando houver pagamento ao fornecedor."}],"answer":"C","comment":"<b>Comentário:</b> Pela competência, o reconhecimento da despesa ocorre no período do consumo dos insumos, não na compra nem no pagamento."},{"n":33,"text":"Relacione: 1. Empréstimos a pagar em 18 meses. 2. Clientes a receber em 4 meses. 3. Fornecedores a pagar em 2 meses. 4. Veículos para uso por 5 anos. Na ordem Ativo Circulante, Ativo Não Circulante, Passivo Circulante, Passivo Não Circulante:","alts":[{"letter":"A","text":"2 - 4 - 3 - 1."},{"letter":"B","text":"4 - 2 - 1 - 3."},{"letter":"C","text":"3 - 1 - 2 - 4."},{"letter":"D","text":"1 - 3 - 4 - 2."}],"answer":"A","comment":"<b>Comentário:</b> Recebíveis em 4 meses são AC; veículos de uso são ANC; fornecedores em 2 meses são PC; empréstimos em 18 meses são PNC."},{"n":34,"text":"Associe: 1. Duplicatas a receber em 8 meses. 2. Máquinas para uso por 7 anos. 3. Salários a pagar no mês seguinte. 4. Financiamento a pagar em 36 meses. Na ordem AC, ANC, PC e PNC:","alts":[{"letter":"A","text":"1 - 2 - 3 - 4."},{"letter":"B","text":"2 - 1 - 4 - 3."},{"letter":"C","text":"3 - 4 - 1 - 2."},{"letter":"D","text":"4 - 3 - 2 - 1."}],"answer":"A","comment":"<b>Comentário:</b> Direitos realizáveis em até 12 meses são AC; máquinas de uso são ANC; obrigações de curto prazo são PC; financiamento de longo prazo e PNC."},{"n":35,"text":"Assinale a alternativa que apresenta apenas componentes do Patrimônio Líquido:","alts":[{"letter":"A","text":"Capital Social - Reservas de Lucros - Ações em Tesouraria."},{"letter":"B","text":"Capital Social - Fornecedores - Reservas de Capital."},{"letter":"C","text":"Debêntures - Ajustes de Avaliação Patrimonial - Capital Social."},{"letter":"D","text":"Investimentos - Capital Social - Reservas de Lucros."}],"answer":"A","comment":"<b>Comentário:</b> Capital social, reservas de lucros e ações em tesouraria integram o PL. Fornecedores e debêntures são passivos; investimentos são ativos."},{"n":36,"text":"Conforme a Lei das S.A., compoem o Patrimônio Líquido:","alts":[{"letter":"A","text":"Reservas de Capital - Ajustes de Avaliação Patrimonial - Prejuízos Acumulados."},{"letter":"B","text":"Caixa - Reservas de Lucros - Capital Social."},{"letter":"C","text":"Dividendos a Pagar - Capital Social - Ações em Tesouraria."},{"letter":"D","text":"Empréstimos - Reservas de Capital - Ajustes de Avaliação Patrimonial."}],"answer":"A","comment":"<b>Comentário:</b> Reservas de capital, ajustes de avaliação patrimonial e prejuízos acumulados são contas do PL. Caixa e ativo; dividendos a pagar e empréstimos são passivos."},{"n":37,"text":"A investidora possui: Omega controlada 80%, PL R$ 900.000; Gama controlada 75%, PL R$ 600.000; Beta coligada 30%, PL R$ 500.000; Delta sem influência 10%, PL R$ 400.000. A participação de não controladores no consolidado e:","alts":[{"letter":"A","text":"R$ 330.000."},{"letter":"B","text":"R$ 480.000."},{"letter":"C","text":"R$ 150.000."},{"letter":"D","text":"R$ 1.100.000."}],"answer":"A","comment":"<b>Comentário:</b> Não controladores existem apenas nas controladas consolidadas. Omega: 20% x 900.000 = 180.000. Gama: 25% x 600.000 = 150.000. Total = 330.000."},{"n":38,"text":"A Cia Mae controla Alfa com 85% de participação e PL de R$ 1.200.000, e Beta com 60% e PL de R$ 800.000. Também possui coligada Gama 25%, PL R$ 700.000. A participação de não controladores e:","alts":[{"letter":"A","text":"R$ 500.000."},{"letter":"B","text":"R$ 675.000."},{"letter":"C","text":"R$ 320.000."},{"letter":"D","text":"R$ 180.000."}],"answer":"A","comment":"<b>Comentário:</b> Calcula-se apenas sobre controladas: Alfa 15% x 1.200.000 = 180.000; Beta 40% x 800.000 = 320.000; total = 500.000. Coligada não entra como não controladores no consolidado."},{"n":39,"text":"Uma empresa adquiriu maquina com: preço R$ 400.000; imposto não recuperavel R$ 40.000; preparacao do local R$ 70.000; materiais consumidos em testes R$ 30.000; honorários dos técnicos dos testes R$ 20.000; valor residual R$ 80.000. O custo inicial do imobilizado e:","alts":[{"letter":"A","text":"R$ 400.000."},{"letter":"B","text":"R$ 440.000."},{"letter":"C","text":"R$ 510.000."},{"letter":"D","text":"R$ 560.000."}],"answer":"D","comment":"<b>Comentário:</b> Custo inicial inclui preço, tributos não recuperaveis e custos diretamente atribuíveis para colocar o ativo em condição de uso: 400.000 + 40.000 + 70.000 + 30.000 + 20.000 = 560.000. Valor residual não reduz o custo inicial; afeta depreciação."},{"n":40,"text":"A Cia Industria instalou equipamento com: preço R$ 300.000; imposto de importacao não recuperavel R$ 30.000; frete e seguro R$ 25.000; instalação R$ 15.000; testes R$ 10.000; vida útil 8 anos; residual R$ 50.000. O custo de registro inicial e:","alts":[{"letter":"A","text":"R$ 330.000."},{"letter":"B","text":"R$ 355.000."},{"letter":"C","text":"R$ 380.000."},{"letter":"D","text":"R$ 430.000."}],"answer":"C","comment":"<b>Comentário:</b> Somam-se todos os custos necessários para colocar o ativo em funcionamento: 300.000 + 30.000 + 25.000 + 15.000 + 10.000 = 380.000. Vida útil e residual são usados na depreciação."},{"n":41,"text":"Uma maquina foi adquirida em 01/01/2021 por R$ 300.000, vida útil inicial de 10 anos e sem residual, depreciação linear. Em 31/12/2025, a vida útil total foi reestimada para 12 anos e o residual passou a R$ 60.000. A depreciação anual a partir de 2026 e:","alts":[{"letter":"A","text":"R$ 15.000."},{"letter":"B","text":"R$ 12.857."},{"letter":"C","text":"R$ 30.000."},{"letter":"D","text":"R$ 60.000."}],"answer":"B","comment":"<b>Comentário:</b> Depreciação acumulada em 5 anos: 300.000/10 x 5 = 150.000. Valor contábil em 31/12/2025 = 150.000. Vida remanescente: 12 - 5 = 7 anos. Base depreciavel nova: 150.000 - 60.000 = 90.000. Depreciação anual = 90.000/7 = 12.857,14."},{"n":42,"text":"Um equipamento foi comprado em 01/01/2020 por R$ 500.000, vida útil inicial de 10 anos, sem residual, método linear. Em 31/12/2024, a vida útil total foi reestimada para 8 anos é o valor residual para R$ 80.000. A depreciação anual futura será:","alts":[{"letter":"A","text":"R$ 56.667."},{"letter":"B","text":"R$ 50.000."},{"letter":"C","text":"R$ 90.000."},{"letter":"D","text":"R$ 80.000."}],"answer":"A","comment":"<b>Comentário:</b> Até 31/12/2024 passaram 5 anos: depreciação acumulada = 500.000/10 x 5 = 250.000. Valor contábil = 250.000. Vida remanescente = 8 - 5 = 3 anos. Nova base = 250.000 - 80.000 = 170.000. Depreciação anual = 170.000/3 = 56.666,67."},{"n":43,"text":"Segundo a Estrutura Conceitual, quais são as características qualitativas fundamentais da informação contábil-financeira útil?","alts":[{"letter":"A","text":"relevância e representação fidedigna."},{"letter":"B","text":"comparabilidade e tempestividade."},{"letter":"C","text":"prudência e conservadorismo."},{"letter":"D","text":"verificabilidade e compreensibilidade."}],"answer":"A","comment":"<b>Comentário:</b> As características fundamentais são relevância e representação fidedigna. As demais são características de melhoria ou termos que não substituem as fundamentais."},{"n":44,"text":"A representação fidedigna, conforme a Estrutura Conceitual, não significa exatidão absoluta em todos os aspectos. Ela exige que a informação seja:","alts":[{"letter":"A","text":"completa, neutra e livre de erro."},{"letter":"B","text":"material, comparável e tempestiva."},{"letter":"C","text":"prudente, conservadora e verificável."},{"letter":"D","text":"uniforme, simples e sintética."}],"answer":"A","comment":"<b>Comentário:</b> A representação fidedigna exige completude, neutralidade e ausência de erro. Livre de erro não é sinônimo de perfeição absoluta, mas de ausência de erros relevantes no processo."},{"n":45,"text":"A informação é considerada material quando sua omissão, distorção ou obscuridade pode influenciar decisões tomadas pelos usuários principais. Esse conceito se relaciona diretamente com:","alts":[{"letter":"A","text":"relevância."},{"letter":"B","text":"comparabilidade."},{"letter":"C","text":"verificabilidade."},{"letter":"D","text":"tempestividade."}],"answer":"A","comment":"<b>Comentário:</b> Materialidade é aspecto específico da relevância. Uma informação material é capaz de influenciar decisões dos usuários."},{"n":46,"text":"O pressuposto da continuidade indica que a entidade:","alts":[{"letter":"A","text":"continuará em operação no futuro previsível, salvo evidência de liquidação ou encerramento."},{"letter":"B","text":"deve reconhecer receitas apenas quando receber caixa."},{"letter":"C","text":"deve compensar ativos e passivos sempre que possível."},{"letter":"D","text":"deve apresentar apenas informações sem estimativas."}],"answer":"A","comment":"<b>Comentário:</b> A continuidade presume a manutenção das operações no futuro previsível. Não se confunde com regime de caixa, compensação ou ausência de estimativas."},{"n":47,"text":"Na NBC TG 26, a compensação entre ativos e passivos ou receitas e despesas:","alts":[{"letter":"A","text":"não deve ser feita, exceto quando exigida ou permitida por norma."},{"letter":"B","text":"é obrigatória sempre que reduzir o tamanho das demonstrações."},{"letter":"C","text":"é livre, desde que facilite a leitura."},{"letter":"D","text":"é vedada apenas para entidades de capital aberto."}],"answer":"A","comment":"<b>Comentário:</b> A regra geral é não compensar. A compensação só ocorre quando uma norma permitir ou exigir."},{"n":48,"text":"Uma empresa comercial apresentou na DVA: receita de contratos com clientes de R$ 180.000,00; CMV de R$ 70.000,00; perdas estimadas com créditos de liquidação duvidosa de R$ 5.000,00; perdas por desvalorização de ativos de R$ 8.000,00; depreciação de R$ 12.000,00, O valor adicionado líquido produzido é:","alts":[{"letter":"A","text":"R$ 85.000,00,"},{"letter":"B","text":"R$ 97.000,00,"},{"letter":"C","text":"R$ 110.000,00,"},{"letter":"D","text":"R$ 168.000,00,"}],"answer":"A","comm function wacomBox(id, innerHtml){
 return `<div class="draw-toolbar" data-toolbar="${id}">
 <button class="tool" onclick="setTool('${id}','draw')">✏️ Caneta</button>
 <button class="tool" onclick="setColor('${id}','#174ea6')">🔵 Azul</button>
 <button class="tool" onclick="setColor('${id}','#dc2626')">🔴 Vermelho</button>
 <button class="tool" onclick="setColor('${id}','#111827')">⚫ Preto</button>
 <button class="tool" onclick="setColor('${id}','rgba(250,204,21,.35)')">🟡 Marca-texto</button>
 <button class="tool" onclick="setColor('${id}','rgba(34,197,94,.30)')">🟢 Marca-texto</button>
 <button class="tool" onclick="setTool('${id}','erase')">🧽 Borracha</button>
 <button class="tool" onclick="setTool('${id}','off')">👆 Responder</button>
 <label style="font-size:13px">Espessura <input aria-label="Espessura da caneta" type="range" min="1" max="12" value="3" oninput="setWidth('${id}',this.value)"></label>
 <button class="tool danger-mini" onclick="clearWacom('${id}')">🗑️ Limpar tinta</button></div>
 <div class="paper-draw" id="paper_${id}"><div class="paper-content">${innerHtml}</div><canvas class="ink-canvas" data-wacom="${id}"></canvas></div>
 <div class="pen-help">Escrita suavizada para Wacom, mouse ou toque. Escreva no centro e nas laterais; para escolher uma alternativa, selecione 👆 Responder. As anotações são preservadas.</div>`;
}
const penState={};
function state(id){return penState[id] ||= {tool:'draw',color:'#174ea6',width:3,active:true};}
function updateToolbar(id){
 const st=state(id), c=document.querySelector(`canvas[data-wacom="${id}"]`);
 if(c){c.style.pointerEvents=st.active?'auto':'none';c.classList.toggle('eraser-cursor',st.tool==='erase');c.classList.toggle('pen-cursor',st.tool!=='erase');}
 const t=document.querySelector(`[data-toolbar="${id}"]`);
 if(t){t.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active', st.tool==='off'?b.textContent.includes('Responder'):st.tool==='erase'?b.textContent.includes('Borracha'):b.textContent.includes('Caneta')));}
}
function setTool(id,tool){const st=state(id);st.tool=tool;st.active=tool!=='off';updateToolbar(id);}
function setColor(id,color){const st=state(id);st.tool='draw';st.active=true;st.color=color;updateToolbar(id);}
function setWidth(id,v){state(id).width=Number(v);}
function setupWacom(){
 document.querySelectorAll('canvas[data-wacom]').forEach(canvas=>{
 const id=canvas.dataset.wacom,ctx=canvas.getContext('2d');
 function resize(){
  const r=canvas.parentElement.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  const previous=canvas.width?canvas.toDataURL():localStorage.getItem('pm_wacom_'+id);
  canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));
  canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  if(previous){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=previous;}
  updateToolbar(id);
 }
 resize();if(canvas.dataset.ready)return;canvas.dataset.ready='1';
 let drawing=false,previous=null,mid=null, pointer=null;
 const pos=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
 const midpoint=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
 function setupStyle(){const st=state(id);ctx.globalCompositeOperation=st.tool==='erase'?'destination-out':'source-over';ctx.strokeStyle=st.color;ctx.fillStyle=st.color;ctx.lineWidth=st.tool==='erase'?26:st.color.startsWith('rgba')?Math.max(14,st.width*5):st.width;ctx.lineCap='round';ctx.lineJoin='round';}
 function start(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();drawing=true;pointer=e.pointerId;canvas.setPointerCapture?.(pointer);previous=pos(e);mid=previous;setupStyle();ctx.beginPath();ctx.arc(previous.x,previous.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();}
 function move(e){if(!drawing||e.pointerId!==pointer)return;e.preventDefault();setupStyle();
  const events=e.getCoalescedEvents?.()||[e];
  for(const event of events){const p=pos(event),m=midpoint(previous,p);ctx.beginPath();ctx.moveTo(mid.x,mid.y);ctx.quadraticCurveTo(previous.x,previous.y,m.x,m.y);ctx.stroke();mid=m;previous=p;}
 }
 function end(e){if(!drawing||e.pointerId!==pointer)return;e.preventDefault();setupStyle();ctx.beginPath();ctx.moveTo(mid.x,mid.y);ctx.lineTo(previous.x,previous.y);ctx.stroke();drawing=false;pointer=null;try{localStorage.setItem('pm_wacom_'+id,canvas.toDataURL('image/png'));}catch(err){console.warn('Não foi possível salvar a tinta',err);}}
 canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
 const observer=new ResizeObserver(()=>{if(!drawing)resize();});observer.observe(canvas.parentElement);
 });
}
function clearWacom(id){localStorage.removeItem('pm_wacom_'+id);const c=document.querySelector(`canvas[data-wacom="${id}"]`);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}
let answers=JSON.parse(localStorage.getItem('pm_l3_answers')||'{}');
let name='Professor Moreira';
let start=Number(localStorage.getItem('pm_l3_start')||0);
function pad(n){return String(n).padStart(2,'0')}
function elapsed(){let s=Math.floor((Date.now()-start)/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
setInterval(()=>{if(start) document.getElementById('timer').textContent=elapsed()},1000);
document.addEventListener('DOMContentLoaded',()=>{const inp=document.getElementById('studentName'); if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter') unlock();});}});
function save(){localStorage.setItem('pm_l3_idx',idx);localStorage.setItem('pm_l3_answers',JSON.stringify(answers));}
function unlock(){
  const n=document.getElementById('studentName').value.trim(); if(!n){alert('Digite o nome do aluno.');return;}
  name=n; localStorage.setItem('pm_l3_name',name); if(!start){start=Date.now();localStorage.setItem('pm_l3_start',start)}
  const msg=encodeURIComponent(`Professor Moreira, sou ${name} e estou iniciando o Quiz Lista 3.`);
  try{ window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank'); }catch(e){}
  mode='question';
  render();
}
function render(){
  if(true){document.getElementById('lock').classList.add('hidden');document.getElementById('bottomNav').classList.remove('hidden');document.getElementById('gridCard').classList.remove('hidden')}
  document.getElementById('bar').style.width=((idx+1)/QUESTIONS.length*100)+'%';
  document.getElementById('metaQ').textContent=`Questão ${idx+1}/${QUESTIONS.length}`;
  if(mode==='final') return renderFinal();
  if(mode==='answer') return renderAnswer();
  renderQuestion(); renderGrid();
}
function renderQuestion(){
  document.getElementById('quiz').classList.remove('hidden'); document.getElementById('answer').classList.add('hidden'); document.getElementById('final').classList.add('hidden');
  document.getElementById('mainBtn').textContent='Mostrar gabarito'; document.getElementById('mainBtn').onclick=showAnswer;
  const q=QUESTIONS[idx]; const sel=answers[q.n]||'';
  const inner=`<span class="qnum">Questão ${String(q.n).padStart(3,'0')}</span><div class="statement">${q.text}</div>`+
    q.alts.map(a=>`<button class="alt ${sel===a.letter?'selected':''}" onclick="selectAlt('${a.letter}')"><span class="letter">${a.letter}</span><span>${a.text}</span></button>`).join('');
  document.getElementById('questionCard').innerHTML=wacomBox('q_'+q.n, inner);
  setupWacom();
}
function selectAlt(l){answers[QUESTIONS[idx].n]=l;save();renderQuestion();renderGrid();}
function renderAnswer(){
  document.getElementById('quiz').classList.add('hidden'); document.getElementById('answer').classList.remove('hidden'); document.getElementById('final').classList.add('hidden');
  document.getElementById('mainBtn').textContent='Ocultar gabarito'; document.getElementById('mainBtn').onclick=()=>{mode='question';render();};
  renderGrid();
  const q=QUESTIONS[idx]; const sel=answers[q.n]||'Não marcada';
  const inner=`<span class="qnum">Comentário da Questão ${String(q.n).padStart(3,'0')}</span>
  <div class="answerBox">Sua resposta: <b>${sel}</b><br>Gabarito: <span class="gabarito">${q.answer}</span></div>
  <div class="statement">${q.text}</div>`+
  q.alts.map(a=>`<div class="alt ${a.letter===q.answer?'correct':(sel===a.letter?'wrong':'')}"><span class="letter">${a.letter}</span><span>${a.text}</span></div>`).join('')+
  `<div class="comment">${q.comment}</div>`;
  document.getElementById('answerCard').innerHTML=wacomBox('c_'+q.n, inner);
  setupWacom();
}
function renderGrid(){
  document.getElementById('grid').innerHTML=QUESTIONS.map((q,i)=>`<button class="dot ${answers[q.n]?'answered':''} ${i===idx?'current':''}" onclick="idx=${i};mode='question';save();render()">${q.n}</button>`).join('');
}
function showAnswer(){mode='answer'; render();}
function next(){ if(idx<QUESTIONS.length-1){idx++; mode='question'; save(); render();} else {mode='final'; render();} }
function prev(){ if(mode==='answer'){mode='question'; render(); return;} if(idx>0){idx--; mode='question'; save(); render();} }
function renderFinal(){
 document.getElementById('quiz').classList.add('hidden'); document.getElementById('answer').classList.add('hidden'); document.getElementById('final').classList.remove('hidden'); document.getElementById('bottomNav').classList.add('hidden'); document.getElementById('gridCard').classList.add('hidden');
 let correct=0, lines=[]; QUESTIONS.forEach(q=>{let a=answers[q.n]||'-'; if(a===q.answer) correct++; lines.push(`${q.n}-${a} (Gabarito: ${q.answer})`);});
 const perc=(correct/QUESTIONS.length*100).toFixed(2).replace('.',',');
 const texto=`Aluno: ${name}
Quiz: Lista 3 - 105 questões
Tempo: ${elapsed()}
Respondidas: ${Object.keys(answers).length}/${QUESTIONS.length}
Acertos: ${correct}
Erros: ${QUESTIONS.length-correct}
Percentual: ${perc}%

Gabarito do aluno:
${lines.join('\n')}`;
 document.getElementById('final').innerHTML=`<h2>Simulado concluído</h2><p><b>Aluno:</b> ${name}</p><p><b>Tempo:</b> ${elapsed()}</p><p><b>Respondidas:</b> ${Object.keys(answers).length}/${QUESTIONS.length}</p><textarea readonly>${texto}</textarea><br><br><button class="ok" style="width:100%" onclick="sendResult()">Enviar gabarito ao Professor</button><br><br><button class="secondary" style="width:100%" onclick="restart()">Recomeçar</button>`;
}
function sendResult(){
 let correct=0, lines=[]; QUESTIONS.forEach(q=>{let a=answers[q.n]||'-'; if(a===q.answer) correct++; lines.push(`${q.n}-${a} (Gabarito: ${q.answer})`);});
 const perc=(correct/QUESTIONS.length*100).toFixed(2).replace('.',',');
 const texto=`Aluno: ${name}
Quiz: Lista 3 - 105 questões
Tempo: ${elapsed()}
Respondidas: ${Object.keys(answers).length}/${QUESTIONS.length}
Acertos: ${correct}
Erros: ${QUESTIONS.length-correct}
Percentual: ${perc}%

Gabarito do aluno:
${lines.join('\n')}`;
 window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`,'_blank');
}
function restart(){ if(confirm('Deseja apagar as respostas e recomeçar?')){localStorage.removeItem('pm_l3_idx');localStorage.removeItem('pm_l3_answers');localStorage.removeItem('pm_l3_start');idx=0;answers={};start=Date.now();localStorage.setItem('pm_l3_start',start);mode='question';document.getElementById('bottomNav').classList.remove('hidden');render();} }
if(name){start=start||Date.now();localStorage.setItem('pm_l3_start',start);render();} else {document.getElementById('bottomNav').classList.add('hidden');document.getElementById('gridCard').classList.add('hidden');}
document.addEventListener('DOMContentLoaded',()=>{name='Professor Moreira';render();});
</script>
</body>
</html>
